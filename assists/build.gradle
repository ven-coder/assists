plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'com.vanniktech.maven.publish'
}

android {
    namespace 'com.ven.assists.base'
    compileSdk rootProject.ext.compileSdk

    defaultConfig {
        minSdk rootProject.ext.minSdk
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation "androidx.core:core-ktx:${rootProject.ext.coreKtxVersion}"
    implementation "androidx.activity:activity-ktx:${rootProject.ext.activityKtxVersion}"
    implementation "androidx.appcompat:appcompat:${rootProject.ext.appcompatVersion}"
    implementation platform("org.jetbrains.kotlin:kotlin-bom:${rootProject.ext.kotlinBomVersion}")
    api "com.blankj:utilcodex:${rootProject.ext.utilcodexVersion}"

    // OkHttp 网络库
    api "com.squareup.okhttp3:okhttp:4.10.0"

    // Gson JSON库
    api "com.google.code.gson:gson:2.11.0"

    // MMKV 键值存储（api 可传递：下游模块 / 插件均可直接使用，避免重复声明）
    api "com.tencent:mmkv:2.2.4"

    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}

ext {
    mavenArtifactId = 'assists-base'
    mavenPomName = 'Assists Base'
    mavenPomDescription = 'Core accessibility automation library for Android'
}
apply from: rootProject.file('gradle/publish-maven-central.gradle')
